services:
  db:
    image: postgres:17
    container_name: sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_pass
      POSTGRES_DB: sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: sentinel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinel-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sentinel.local.dev
      PGADMIN_DEFAULT_PASSWORD: SentinelPgAdmin2026!
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_pass@db:5432/sentinel
      REDIS_URL: redis://redis:6379/0
      ALERT_MEDIUM_THRESHOLD: "3.0"
      ALERT_HIGH_THRESHOLD: "5.0"
      EVENT_TYPE_WEIGHTS: '{"login":1.0,"login_failure":3.0,"password_change":2.0,"mfa_enabled":-1.0,"mfa_disabled":2.5,"permission_change":3.0,"data_export":4.0,"admin_action":3.5}'
    ports:
      - "18000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

